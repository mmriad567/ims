{% extends 'base.html' %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <img src="/static/images/logo.png" alt="Logo" class="h-20 w-auto mx-auto mb-4 object-contain">
            <h2 class="text-2xl font-extrabold text-slate-900">Welcome Back</h2>
            <p class="text-slate-500 text-sm mt-1">Please sign in to your account</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-rose-50 text-rose-600 text-sm p-3 rounded-lg border border-rose-100">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="ph ph-envelope-simple"></i>
                    </div>
                    <input type="email" name="username" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all text-sm" placeholder="admin@ims.local">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="ph ph-lock-simple"></i>
                    </div>
                    <input type="password" name="password" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all text-sm" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700 focus:ring-4 focus:ring-orange-200 transition-all shadow-lg shadow-orange-200">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
