{% extends "base.html" %}

{% block title %}Student Dashboard{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Student Dashboard</h1>
<p class="mb-4">Welcome, {{ request.user.full_name }}</p>
<div class="bg-white p-6 rounded shadow mb-4">
    <a href="{% url 'attendance:my_attendance' %}" class="text-blue-600 underline font-semibold">View My Attendance</a>

<div class="bg-white p-6 rounded shadow mb-4">Your attendance will show here (P5)</div>
<div class="bg-white p-6 rounded shadow">

</div>
{% endblock %}
