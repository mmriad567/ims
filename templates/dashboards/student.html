{% extends "base.html" %}

{% block title %}Student Dashboard{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Student Dashboard</h1>
<p class="mb-4">Welcome, {{ request.user.full_name }}</p>
<a href="{% url 'attendance:my_attendance' %}" class="block p-4 bg-white rounded shadow hover:shadow-lg transition border-l-4 border-blue-500 mb-4">
    <h3 class="text-lg font-bold text-gray-800">View My Attendance</h3>
    <p class="text-gray-600">Check your daily attendance percentage.</p>
</a>
<a href="{% url 'results:my_result' %}" class="block p-4 bg-white rounded shadow hover:shadow-lg transition border-l-4 border-green-500 mb-4">
    <h3 class="text-lg font-bold text-gray-800">View My Result</h3>
    <p class="text-gray-600">Check your exam marks and GPA.</p>
</a>
{% endblock %}
