<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-gray-100">
    <nav class="bg-blue-700 text-white px-6 py-3 flex items-center justify-between">
        <a href="/" class="text-xl font-bold">IMS</a>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <span>{{ user.full_name }}</span>
                <span class="bg-blue-900 text-xs px-2 py-1 rounded uppercase">{{ user.role }}</span>
                <form method="post" action="/logout/" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="underline">Logout</button>
                </form>
            {% else %}
                <a href="/login/" class="underline">Login</a>
            {% endif %}
        </div>
    </nav>
    <main class="p-6">
        {% if messages %}
          <div class="max-w-4xl mx-auto mt-4 px-4">
            {% for message in messages %}
              <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4 shadow-sm">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
