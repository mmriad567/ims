<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-700 text-white px-6 py-3 flex items-center justify-between">
        <a href="/" class="text-xl font-bold">IMS</a>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <span>{{ user.full_name }}</span>
                <span class="bg-blue-900 text-xs px-2 py-1 rounded uppercase">{{ user.role }}</span>
                <form method="post" action="/logout/" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="underline">Logout</button>
                </form>
            {% else %}
                <a href="/login/" class="underline">Login</a>
            {% endif %}
        </div>
    </nav>
    <main class="p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
